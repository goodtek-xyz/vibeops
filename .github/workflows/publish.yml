# Publish @goodtek/vibeops to npm with npm Trusted Publishing (OIDC).
#
# No npm token is stored anywhere: npm exchanges the job's OIDC token for a
# short-lived publish credential and attaches provenance automatically
# (public repo + public package). Requirements (docs.npmjs.com/trusted-publishers):
# GitHub-hosted runner, `id-token: write`, npm CLI >= 11.5.1, Node >= 22.14.0,
# package.json `repository.url` matching this repository, and this workflow's
# filename (`publish.yml`) registered as the package's trusted publisher.
#
# Trigger: push a tag `vX.Y.Z` that points at a commit on `main` and matches
# package.json `version` (see docs/project/09-deployment.md).
name: Publish

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Check npm CLI version (trusted publishing needs >= 11.5.1)
        run: |
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            const ok = a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1)));
            if (!ok) { console.error(`npm ${process.argv[1]} < 11.5.1`); process.exit(1); }
          ' "$(npm --version)"
      - name: Tag must match package.json and be on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "${TAG}" != "v${version}" ]; then
            echo "::error::tag ${TAG} does not match package.json version ${version}"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::tag ${TAG} (${GITHUB_SHA}) is not on main"
            exit 1
          fi
      - name: Install pnpm (version from package.json packageManager)
        run: npm install -g "$(node -p "require('./package.json').packageManager")"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Git identity for test repositories
        run: |
          git config --global user.name "vibeops-ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - name: Verify
        run: |
          pnpm lint
          pnpm typecheck
          pnpm build
          node --test tests/*.test.mjs
          node scripts/smoke.mjs
      - name: Publish (OIDC, provenance)
        run: npm publish --access public
