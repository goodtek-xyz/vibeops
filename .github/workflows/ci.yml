# CI for pull requests and the long-lived branches (develop, main).
#
# Public repository: jobs run only on GitHub-hosted runners, so pull requests
# from forks never execute on maintainer-owned machines. The token is read-only.
# Third-party actions are pinned by full commit SHA (tag in the trailing comment).
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify · node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # package.json engines: node >= 20
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install pnpm (version from package.json packageManager)
        run: npm install -g "$(node -p "require('./package.json').packageManager")"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Git identity for test repositories
        run: |
          git config --global user.name "vibeops-ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Test
        run: node --test tests/*.test.mjs
      - name: Smoke
        run: node scripts/smoke.mjs

  secret-scan:
    name: Secret scan · gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz; must also match the release's checksums file.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned release, checksum verified)
        env:
          # This job's read-only token. Authenticated REST calls are not held to the 60 requests/hour per IP of
          # unauthenticated ones (GitHub docs "Rate limits for the REST API"). Reading a public repository's
          # release needs nothing beyond `contents: read` above.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          api="https://api.github.com/repos/gitleaks/gitleaks/releases"
          workdir="$(mktemp -d)"
          cd "$workdir"
          # Download through the REST API release-asset endpoint, not github.com/<repo>/releases/download/: on
          # 2026-11-08 the web path answered HTTP 504 for every release for over an hour while the API path
          # answered. GitHub docs "REST API endpoints for release assets" > "Get a release asset": with
          # `Accept: application/octet-stream` it redirects (302) to the file; curl -L follows it and does not
          # send the Authorization header to the other host.
          #
          # Retries, curl(1) --retry: on a timeout or HTTP 408, 429, 500, 502, 503, 504, waiting 1 s and doubling
          # the wait each time (1+2+4+8+16 = 31 s for 5 retries); --retry-connrefused adds a refused connection;
          # --retry-max-time stops starting retries after 120 s, a small, bounded part of the job's timeout. Not
          # --retry-all-errors: curl(1) advises against it by default, and it would also retry a 404 (a wrong
          # version), which must fail at once. No jitter: curl has no option for it, and jitter spreads many
          # clients retrying against one server at once; this job makes three requests, so there is no herd to
          # break up. The checksums below verify whatever was downloaded.
          curl_api=(curl -sSfL --retry 5 --retry-connrefused --retry-max-time 120
            -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")
          "${curl_api[@]}" -H "Accept: application/vnd.github+json" -o release.json "${api}/tags/v${GITLEAKS_VERSION}"
          for name in "$tarball" "$checksums"; do
            id="$(jq -er --arg n "$name" '.assets[] | select(.name == $n) | .id' release.json)" \
              || { echo "::error::gitleaks release v${GITLEAKS_VERSION} has no asset ${name}"; exit 1; }
            "${curl_api[@]}" -H "Accept: application/octet-stream" -o "$name" "${api}/assets/${id}"
          done
          grep -E "^[0-9a-f]{64}  ${tarball}\$" "$checksums" > release.sha256
          echo "${GITLEAKS_SHA256}  ${tarball}" > pinned.sha256
          cmp release.sha256 pinned.sha256
          sha256sum -c pinned.sha256
          tar -xzf "${tarball}" gitleaks
          install -m 0755 gitleaks "${RUNNER_TEMP}/gitleaks"
          "${RUNNER_TEMP}/gitleaks" version
      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          "${RUNNER_TEMP}/gitleaks" git --redact --no-banner --exit-code 1 \
            --log-opts "${BASE_SHA}..${HEAD_SHA}" .
      - name: Scan full history
        if: github.event_name == 'push'
        run: |
          "${RUNNER_TEMP}/gitleaks" git --redact --no-banner --exit-code 1 .
